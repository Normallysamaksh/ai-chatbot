services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    ports:
      - "8000:8000"
    env_file:
      - .env

    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/chroma_db:/app/backend/chroma_db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "8501:8501"
    depends_on:
      - backend
